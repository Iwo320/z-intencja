<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie — Z intencją</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f5ef;
      --wine: #3a2a32;
      --muted: #7b7169;
      --gold: #8a6f45;
      --border: rgba(58, 42, 50, 0.16);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 45% at 50% -8%, rgba(138, 111, 69, 0.10), transparent 60%),
        var(--bg);
      color: var(--wine);
      font-family: 'Manrope', sans-serif;
    }
    .card {
      width: min(100%, 400px);
      background: #fffdf9;
      border: 1px solid var(--border);
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(58, 42, 50, 0.10);
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .eyebrow {
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .lead { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }
    form { display: grid; gap: 14px; }
    label {
      text-align: left;
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    input {
      margin-top: 6px;
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--wine);
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus { border-color: var(--gold); }
    button {
      margin-top: 8px;
      padding: 15px;
      border: 0;
      background: var(--wine);
      color: var(--bg);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: var(--gold); }
    button:disabled { opacity: 0.5; cursor: wait; }
    .error {
      display: none;
      font-size: 0.8rem;
      color: #a0433f;
    }
    .error.show { display: block; }
    .back {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--gold); }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">Z intencją</p>
    <p class="eyebrow">panel · dostęp chroniony</p>
    <h1>Logowanie</h1>
    <p class="lead">Strefa wyłącznie dla Karoliny.</p>

    <form data-login-form>
      <label>Hasło
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" data-error>Nieprawidłowe hasło. Spróbuj ponownie.</p>
      <button type="submit" data-submit>Zaloguj się</button>
    </form>

    <a class="back" href="/">← wróć na stronę</a>
  </main>

  <script>
    const form = document.querySelector('[data-login-form]');
    const errorEl = document.querySelector('[data-error]');
    const submit = document.querySelector('[data-submit]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      submit.disabled = true;
      submit.textContent = 'Sprawdzam…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: form.password.value }),
        });
        if (res.ok) {
          window.location.href = '/admin';
          return;
        }
        errorEl.classList.add('show');
      } catch {
        errorEl.textContent = 'Błąd połączenia. Spróbuj ponownie.';
        errorEl.classList.add('show');
      } finally {
        submit.disabled = false;
        submit.textContent = 'Zaloguj się';
      }
    });
  </script>
</body>
</html>
